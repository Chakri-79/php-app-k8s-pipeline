apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  labels:
    release: prometheus
type: Opaque
stringData:
  slack_webhook_url: "https://hooks.slack.com/services/REPLACE_WITH_YOUR_WEBHOOK"

---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: spring-alertmanager-config
  labels:
    release: prometheus
spec:
  route:
    groupBy:
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
    continue: true
    receiver: slack-notification
    routes:
      - receiver: slack-notification
        continue: true
  receivers:
    - name: slack-notification
      slackConfigs:
        - channel: bloodbank_app_monitoring
          apiURL:
            name: slack-webhook
            key: slack_webhook_url
          sendResolved: true
          title: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
          text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
